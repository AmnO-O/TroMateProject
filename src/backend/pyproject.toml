[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tromate-backend"
version = "0.1.0"
description = "TroMate Telegram Mini App backend and Telegram bot library spike"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.159.1",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
ptb = ["python-telegram-bot==22.8"]
aiogram = ["aiogram==3.31.0"]
telebot = ["pyTelegramBotAPI==4.37.1"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]
all = [
  "python-telegram-bot==22.8",
  "aiogram==3.31.0",
  "pyTelegramBotAPI==4.37.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
